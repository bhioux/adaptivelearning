<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="description" content="Mobile course player — big video player, scrubber, quick actions."/>
  <title>Course Player — Mobile</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"/>
  <link rel="stylesheet" href="../design-tokens.css"/>
  <link rel="stylesheet" href="../styles.css"/>
  <link rel="stylesheet" href="styles.css"/>
  <script src="../shell.js"></script>
  <style>
    .phone-body { padding: var(--space-4); }
    .big-player { aspect-ratio: 4/3; border-radius: var(--radius-xl); overflow: hidden; background: #0d0f12; display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer; box-shadow: var(--shadow-md); }
    .big-player .play-btn { width: 72px; height: 72px; border-radius: 50%; background: rgba(255,255,255,0.95); }
    .scrubber-row { display: flex; align-items: center; gap: var(--space-3); margin-top: var(--space-4); color: var(--color-text-muted); font-size: var(--text-caption); }
    .scrubber-track { flex: 1; height: 6px; border-radius: var(--radius-pill); background: var(--color-surface-3); overflow: hidden; }
    .scrubber-track .fill { height: 100%; background: var(--color-primary); width: 70%; }
    .speed-btn { display: inline-flex; align-items: center; gap: 2px; font-size: var(--text-body-xs); color: var(--color-text-dim); }
    .notes-panel { margin-top: var(--space-4); padding: var(--space-3); border: 1px dashed var(--color-border-strong); border-radius: var(--radius-lg); background: var(--color-surface-2); }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="status-bar">9:42 AM</div>
    <main class="phone-body">
      <div class="app-nav">
        <button class="back-btn" aria-label="Back"><span class="icon icon-sm"></span></button>
        <span class="app-nav-title">Lesson 3 — Epsilon-Delta</span>
        <span class="app-nav-right"></span>
      </div>

      <!-- Big player -->
      <div class="big-player" role="button" aria-label="Play video">
        <span class="play-btn"><span class="icon"></span></span>
      </div>

      <!-- Scrubber -->
      <div class="scrubber-row">
        <span id="m-time">00:42</span>
        <span class="scrubber-track"><span class="fill"></span></span>
        <span>03:51</span>
      </div>

      <div class="row wrap mt-3">
        <span class="speed-btn">1.0×</span>
        <span class="chip chip--alternate">CC on</span>
        <span class="chip chip--alternate">Chapter 2</span>
      </div>

      <!-- Quick actions -->
      <div class="m-sticky-bar">
        <button class="btn btn--ghost btn--sm" id="m-notes">Notes</button>
        <button class="btn btn--primary btn--sm" id="m-quiz">Start quiz →</button>
        <button class="btn btn--ghost btn--sm" id="m-next">Next lesson</button>
      </div>

      <!-- Next lesson banner -->
      <div class="notes-panel">
        <div class="muted text-xs">Quick recap</div>
        <h4 class="bold" style="margin-top: 2px;">Limit definition — your notes</h4>
      </div>
    </main>
    <div class="home-indicator"></div>
  </div>
  <script>
    (function () {
      const A = window.A;
      document.querySelectorAll(".back-btn .icon").forEach((s) => { s.innerHTML = A.icons.arrowLeft; });
      document.querySelector(".big-player .play-btn .icon").innerHTML = A.icons.playCircle;
      ["m-notes", "m-quiz", "m-next", ".big-player"].forEach((sel) => {
        const el = document.querySelector(sel);
        if (el) el.addEventListener("click", () => A.toast("Action: " + sel, "info"));
      });
    })();
  </script>
</body>
</html>
