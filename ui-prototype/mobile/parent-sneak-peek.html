<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="description" content="Mobile parent sneak peek — live stream, countdown, and reports."/>
  <title>Parent Sneaks — Mobile</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"/>
  <link rel="stylesheet" href="../design-tokens.css"/>
  <link rel="stylesheet" href="../styles.css"/>
  <link rel="stylesheet" href="styles.css"/>
  <script src="../shell.js"></script>
  <style>
    .phone-body { padding: var(--space-4); }
    .sneak-card-m { border: 1px solid var(--color-border-subtle); border-radius: var(--radius-lg); background: var(--color-surface); overflow: hidden; box-shadow: var(--shadow-sm); }
    .sneak-card-m .thumb-m { aspect-ratio: 16/9; background: linear-gradient(135deg, var(--color-surface-3), var(--color-primary-light)); display: flex; align-items: flex-end; padding: var(--space-4); position: relative; }
    .sneak-card-m .thumb-m .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #fff; animation: pulse-m 1.1s infinite; }
    @keyframes pulse-m { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }
    .report-row { display: flex; justify-content: space-between; align-items: center; padding: var(--space-3) 0; border-bottom: 1px solid var(--color-border-subtle); }
    .report-row .label { font-size: var(--text-body-sm); color: var(--color-text-muted); }
    .report-row .value { font-size: var(--text-heading-md); font-weight: var(--weight-semibold); }
    .progress-bar-m { height: 8px; border-radius: var(--radius-pill); background: var(--color-surface-3); overflow: hidden; margin-top: var(--space-1); }
    .progress-bar-m .bar { height: 100%; background: linear-gradient(90deg, var(--color-success), var(--color-primary)); }
    .m-grid { display: grid; gap: var(--space-3); }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="status-bar">11:07 AM</div>
    <main class="phone-body">
      <div class="app-nav">
        <button class="back-btn" aria-label="Back"><span class="icon icon-sm"></span></button>
        <span class="app-nav-title">Sneak peek</span>
        <span class="app-nav-right"></span>
      </div>

      <div class="sneak-card-m" aria-label="Live sneak peek">
        <div class="thumb-m">
          <span class="live-dot" aria-hidden="true"></span>
        </div>
        <div class="body-m" style="padding: var(--space-3); display: flex; flex-direction: column; gap: var(--space-3);">
          <div class="row wrap"><span class="badge">Calculus I</span><span class="status-pill--danger">Live</span></div>
          <h4 class="heading-md">Session in progress</h4>
          <div class="countdown-m" style="display: flex; gap: var(--space-2); align-items: baseline;">
            <span class="num" style="font-size: var(--text-display-lg); font-weight: var(--weight-bold); color: var(--color-action);">00</span><span style="font-size: var(--text-heading-md);">:</span>
            <span class="num" style="font-size: var(--text-display-lg); font-weight: var(--weight-bold); color: var(--color-action);">58</span>
            <span class="muted">sec left</span>
          </div>
          <div class="row wrap"><span class="badge">View-only (listen)</span><span class="badge">120s max</span></div>
          <button class="btn btn--primary btn--sm" id="m-sneak">End sneak peek</button>
        </div>
      </div>

      <div class="m-grid">
        <div class="report-row"><span class="label">Lessons completed</span><span class="value">18</span><span class="muted text-xs">Week 2/12</span></div>
        <div class="report-row"><span class="label">Study time</span><span class="value">14</span><span class="muted text-xs">hrs/week</span></div>
        <div class="report-row"><span class="label">Average grade</span><span class="value">88%</span><span class="muted text-xs">↗ 12 pts</span></div>
      </div>
    </main>
    <div class="home-indicator"></div>
  </div>
  <script>
    (function () {
      const A = window.A;
      document.querySelectorAll(".back-btn .icon").forEach((s) => { s.innerHTML = A.icons.arrowLeft; });
      document.getElementById("m-sneak").addEventListener("click", () => A.toast("Sneak peek ended — auto-terminate sent", "success"));
    })();
  </script>
</body>
</html>
